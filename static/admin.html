<!doctype html>
<!-- Admin shell (Phase 0). Tabs: Data + History are Track D (admin/data.js),
     Logs is Track E (admin/logs.js). Each module exports mount(el, session). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Center Admin</title>
  <link rel="stylesheet" href="/static/base.css">
  <style>
    header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between;
             padding: 12px var(--space); background: var(--brand-primary); color: #fff; }
    header a, header button { color: #fff; }
    nav { display: flex; gap: 4px; padding: 8px var(--space); border-bottom: 1px solid var(--border);
          overflow-x: auto; background: var(--surface); }
    nav button { border: 0; background: none; padding: 8px 12px; border-radius: 8px; font: inherit;
                 color: var(--text); cursor: pointer; }
    nav button[aria-selected="true"] { background: var(--brand-bg); font-weight: 600; }
    main { max-width: 1000px; margin: 0 auto; padding: var(--space); }
    .muted { color: var(--text-muted); }
  </style>
</head>
<body>
  <header>
    <strong id="center-name">Admin</strong>
    <span>
      <span id="who" class="muted" style="color:#fff;opacity:.85"></span>
      <a href="/">Chat</a>
      <button id="reset-session" type="button" style="background:none;border:1px solid #fff;border-radius:8px;padding:4px 10px;cursor:pointer">Start over</button>
    </span>
  </header>
  <nav role="tablist">
    <button role="tab" data-tab="data" aria-selected="true">Data</button>
    <button role="tab" data-tab="history" aria-selected="false">History</button>
    <button role="tab" data-tab="logs" aria-selected="false">Logs</button>
  </nav>
  <main id="tab-panel"><p class="muted">Loading…</p></main>

  <script type="module">
    const panel = document.getElementById("tab-panel");
    const res = await fetch("/api/session");
    const session = res.ok ? await res.json() : null;
    if (!session || session.role !== "admin") { location.href = "/"; throw new Error("not an admin session"); }

    const theme = session.center.theme || {};
    if (theme.primary) document.documentElement.style.setProperty("--brand-primary", theme.primary);
    if (theme.accent) document.documentElement.style.setProperty("--brand-accent", theme.accent);
    document.getElementById("center-name").textContent = session.center.name + " · Admin";
    document.getElementById("who").textContent = "Signed in as " + session.display_name;
    document.getElementById("reset-session").onclick = async () => {
      await fetch("/api/session", { method: "DELETE" });
      location.href = "/";
    };

    const modules = {
      data: () => import("/static/admin/data.js").then(m => m.mountData),
      history: () => import("/static/admin/data.js").then(m => m.mountHistory),
      logs: () => import("/static/admin/logs.js").then(m => m.mount),
    };
    async function show(tab) {
      document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
      panel.innerHTML = "";
      try { (await modules[tab]())(panel, session); }
      catch (e) { panel.innerHTML = `<p class="muted">This tab isn't built yet.</p>`; }
    }
    document.querySelectorAll("nav button").forEach(b => b.onclick = () => show(b.dataset.tab));
    show("data");
  </script>
</body>
</html>
