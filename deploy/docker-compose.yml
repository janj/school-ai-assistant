# Run from /opt/school-ai:
#   docker compose -f deploy/docker-compose.yml up -d --build   (deploy.sh links deploy/.env -> ../.env)
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - path: ../.env          # /opt/school-ai/.env on the server
        required: false
    environment:
      DB_PATH: /app/data/school.db
    volumes:
      - school_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  school_data:
  caddy_data:
  caddy_config:
